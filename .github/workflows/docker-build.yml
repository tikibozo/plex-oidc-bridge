name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'main.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: 'Release version (e.g. 0.5.0). When set, the image is tagged X.Y.Z / X.Y / X in addition to latest.'
        required: false
        type: string
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve release tags
        id: rel
        if: ${{ inputs.version != '' }}
        run: |
          v='${{ inputs.version }}'
          echo "full=$v"        >> "$GITHUB_OUTPUT"   # 0.5.0
          echo "majmin=${v%.*}" >> "$GITHUB_OUTPUT"   # 0.5
          echo "maj=${v%%.*}"   >> "$GITHUB_OUTPUT"   # 0

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,enable=${{ inputs.version == '' }}
            type=raw,value=${{ steps.rel.outputs.full }},enable=${{ inputs.version != '' }}
            type=raw,value=${{ steps.rel.outputs.majmin }},enable=${{ inputs.version != '' }}
            type=raw,value=${{ steps.rel.outputs.maj }},enable=${{ inputs.version != '' }}

      # Trivy can't load a multi-arch manifest; scan amd64 only. The HIGH/CRITICAL
      # gate is the Go stdlib (arch-independent) + Alpine pkgs (parallel across
      # arches), so an amd64 scan is representative for blocking the publish.
      - name: Build amd64 image locally for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_NAME }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (block on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          format: 'table'

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
