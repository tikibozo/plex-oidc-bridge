name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'  # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  # Force Node 24 for any JS actions still pinned to Node 20 (e.g. gitleaks-action@v2).
  # Harmless for actions already on Node 24; remove once upstream catches up.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          check-latest: true
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  gosec:
    name: gosec (HIGH)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: securego/gosec@master
        with:
          args: -severity high ./...

  staticcheck:
    name: staticcheck (warn-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          check-latest: true
      - name: Run staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL (Go)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: go
          queries: security-and-quality
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4

  trivy:
    name: Trivy image scan
    runs-on: ubuntu-latest
    # Only run after the docker-build workflow has had a chance to publish.
    # On schedule/manual dispatch we scan the already-published :latest.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    outputs:
      findings: ${{ steps.scan.outcome == 'failure' }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Run Trivy on published image
        id: scan
        # Findings don't fail the run here; they trigger the Trivy-gated
        # rebuild below. The run only goes red if the rebuild can't clear them.
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}:latest
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          format: 'table'
      - name: Resolve current release version
        id: version
        if: steps.scan.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  # Fixable CVEs in the published image (new CVEs in unchanged base-image
  # packages, which Renovate structurally can't see) are cleared by rebuilding
  # main at the current version; the build's own Trivy gate blocks the push if
  # the fix isn't actually available upstream yet.
  rebuild:
    name: Auto-rebuild on findings
    needs: trivy
    if: needs.trivy.outputs.findings == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build.yml
    with:
      version: ${{ needs.trivy.outputs.version }}
    secrets: inherit

  verify:
    name: Verify rebuilt :latest
    needs: [trivy, rebuild]
    if: needs.trivy.outputs.findings == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Re-scan published image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}:latest
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          format: 'table'
